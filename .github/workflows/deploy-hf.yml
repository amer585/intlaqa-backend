name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel a previous run on the same ref.
concurrency:
  group: hf-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --ignore-scripts
      - run: npm test --if-present

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # HF_SPACE is read from Variable OR Secret, falling back to amer21/mcp.
          # Put it in whichever tab you like — it will still work.
          HF_SPACE: ${{ vars.HF_SPACE || secrets.HF_SPACE || 'amer21/mcp' }}
        run: |
          # Strip any stray whitespace (tabs/spaces/newlines) from pasted values.
          HF_TOKEN="$(printf '%s' "$HF_TOKEN" | tr -d '[:space:]')"
          HF_SPACE="$(printf '%s' "$HF_SPACE" | tr -d '[:space:]')"
          if [ -z "$HF_TOKEN" ]; then
            echo "FATAL: HF_TOKEN secret is not set. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Deploying to Hugging Face Space: $HF_SPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add space "https://amer585:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" || \
            git remote set-url space "https://amer585:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}"
          git push -f space main
          echo "✓ Pushed to https://huggingface.co/spaces/$HF_SPACE"
